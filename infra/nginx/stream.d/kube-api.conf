# Reverse proxy / LB for the Kubernetes API (L4 TCP passthrough).
# Goes on the proxy VM at /etc/nginx/stream.d/kube-api.conf, loaded via a
# top-level `stream { include /etc/nginx/stream.d/*.conf; }` in nginx.conf.
#
# MUST stay L4: the kube API uses client-cert mTLS that has to reach the API
# server untouched. Do NOT add ssl_* / terminate TLS here (would break kubectl
# auth and expose plaintext). L7 is only for app/ingress traffic you inspect.

upstream kube_api {
    # Default LB = round robin. For the kube API, least_conn is often better
    # (long-lived watches); uncomment to use it:
    # least_conn;
    server 192.168.255.134:6443 max_fails=3 fail_timeout=10s;   # control-plane-1
    # server 192.168.255.140:6443 max_fails=3 fail_timeout=10s; # control-plane-2 (future HA)
    # server 192.168.255.141:6443 max_fails=3 fail_timeout=10s; # control-plane-3 (future HA)
    # server 192.168.255.142:6443 backup;                       # standby (future)
}

# Basic per-source-IP connection cap (DoS protection).
limit_conn_zone $binary_remote_addr zone=apiconn:10m;

log_format kube '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time "$upstream_addr"';
access_log /var/log/nginx/kube-api.log kube;

server {
    listen 6443;
    proxy_pass kube_api;
    proxy_connect_timeout 5s;
    proxy_timeout 20m;          # long-lived watch/logs connections
    limit_conn apiconn 50;      # max 50 conns per source IP
}
