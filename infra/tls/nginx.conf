# mTLS front-door for the agent. Terminates TLS and requires a client certificate
# signed by our CA before forwarding to the agent (plain HTTP, internal network).
# The agent is NOT published directly when this is in use (see the compose override).
events {}

http {
    # Access/error logs go to stdout/stderr so the host log pipeline (OTel -> Loki)
    # picks them up like every other container.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 443 ssl;
        server_name ai-dev;

        # This proxy's own identity (server cert), signed by our CA.
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        # mTLS: only accept clients presenting a cert signed by this CA.
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;            # <-- refuses any connection without a valid client cert
        ssl_verify_depth 1;

        # Modern TLS only.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Keep long investigations alive (CPU model is slow; mirror the client timeout).
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;

        location / {
            proxy_pass http://agent:8080;         # agent stays plain HTTP, internal only
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Pass the verified client CN downstream for auditing (optional).
            proxy_set_header X-Client-CN $ssl_client_s_dn;
        }
    }
}
