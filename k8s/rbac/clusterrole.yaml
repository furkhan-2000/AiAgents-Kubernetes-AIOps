# Read-only permissions for the AI agent. Only get/list/watch, only on the
# resources the agent needs. NEVER secrets, NEVER configmaps, no write verbs.
# Keep this in sync with the agent's app-level allowlist (config.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-readonly
  labels:
    app.kubernetes.io/part-of: aiops-agent
    access-tier: read-only
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - nodes
      - services
      - namespaces
      - events
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - replicationcontrollers
      - resourcequotas
      - limitranges
      - componentstatuses
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "gatewayclasses", "httproutes", "tcproutes", "grpcroutes"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # VerticalPodAutoscaler lives in its own API group; enable only if VPA is installed:
  # - apiGroups: ["autoscaling.k8s.io"]
  #   resources: ["verticalpodautoscalers"]
  #   verbs: ["get", "list", "watch"]
