# Identity for the AI agent. It holds no permissions on its own; access comes
# only from the ClusterRole bound to it. Kept even when using client-cert (User)
# auth, so either auth mode works.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-agent
  namespace: default
  labels:
    app.kubernetes.io/name: ai-agent
    app.kubernetes.io/part-of: aiops-agent
    access-tier: read-only
# Do not auto-mount a token into pods; the agent authenticates from outside the
# cluster (client-cert User, or a short-lived token issued on demand).
automountServiceAccountToken: false
