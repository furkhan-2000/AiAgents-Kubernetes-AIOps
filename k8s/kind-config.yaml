# Kind cluster config. Node image pinned by digest to k8s 1.34 (highest that
# Kind v0.30.0 ships). apiServerAddress MUST equal the cluster VM's STATIC IP,
# else the API cert SAN won't match and the Kind create will fail to bind.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "192.168.255.134"   # cluster VM static IP (set in netplan)
  apiServerPort: 6443
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  - role: worker
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
  - role: worker
    image: kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a
