# Brings up Ollama (brain) + Agent with the two networks and full hardening.
# Ollama sits on AI-Internal only (no internet). Agent sits on BOTH:
# AI-Internal to reach Ollama, AI-Agent to reach the cluster.
#
# Usage (on the AI server):
#   export AGENT_TOKEN="<shared secret; same value the bastion sends>"
#   docker compose up -d
#
# Prereqs:
#   - networks AI-Internal (internal) and AI-Agent exist (created once, out of band)
#   - the model is already in the `ollama` volume (pulled once via a temporary
#     bridge; AI-Internal has no internet)
#   - the agent kubeconfig is at AGENT_KUBECONFIG (default /etc/ai-agent/kubeconfig),
#     owned by uid 1000, mode 0600 (so the non-root container user can read it)
#
# Overridable env (sensible defaults):
#   AGENT_BIND_IP       host IP the agent is published on (default 192.168.255.30)
#   AGENT_KUBECONFIG    host path to the read-only kubeconfig (default /etc/ai-agent/kubeconfig)
#
# SECURITY TODO: the agent is plain HTTP on :443 today. Put TLS (then mTLS so only
# the bastion cert connects) in front before production. Never commit the kubeconfig,
# certs, or AGENT_TOKEN to git.

networks:
  # Pre-created out of band; referenced here as external so compose reuses them.
  AI-Internal:
    name: AI-Internal
    external: true          # internal-only net (no internet): Ollama is caged here
  AI-Agent:
    name: AI-Agent
    external: true          # can reach the Kubernetes cluster / proxy

volumes:
  ollama:
    name: ollama
    external: true          # holds the model; attached to Ollama only
  agent_memory:             # RAG memory DB (tool names only, no cluster data)

services:
  ollama:
    image: ollama/ollama@sha256:adca95a12c2b386a8f9a995e7fa0600e187e3323b5e5522f5a6c3b1ec73eff99
    container_name: ollama
    restart: unless-stopped
    networks: [AI-Internal]           # internal only, 1 NIC
    ports:
      - "127.0.0.1:11434:11434"       # localhost only
    volumes:
      - ollama:/home/ollama/.ollama
    environment:
      HOME: /home/ollama
      OLLAMA_MODELS: /home/ollama/.ollama/models
      # Keep the model resident between requests (no slow cold reloads on CPU).
      OLLAMA_KEEP_ALIVE: "30m"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Host: 6 cores, ~11.6Gi RAM, NO swap. 7B (Q4) ~5.5 GB resident + KV cache.
    # 8g leaves headroom for the 1g agent + OS (no swap = must not overcommit).
    mem_limit: 8g
    # 5 of 6 cores for inference (speeds prompt prefill); 1 core for agent + OS.
    cpus: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  agent:
    build:
      context: .
      args:
        VERSION: "1.0"
        VCS_REF: "${GIT_SHA:-unknown}"   # export GIT_SHA=$(git rev-parse --short HEAD) for provenance
    image: agent:1.0
    container_name: agent
    restart: unless-stopped
    depends_on: [ollama]
    networks: [AI-Internal, AI-Agent]   # BOTH networks = 2 NICs
    ports:
      # Published on the host IP so the bastion can reach it; firewall allows 443
      # from the bastion only. (Plain HTTP today -> add TLS/mTLS in front.)
      - "${AGENT_BIND_IP:-192.168.255.30}:443:8080"
    environment:
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:7b-instruct-q5_K_M"
      AGENT_TOKEN: "${AGENT_TOKEN:?set AGENT_TOKEN before compose up}"  # from host/vault, never committed
    volumes:
      # Read-only, least-privilege kubeconfig (SA/mTLS user = read-only RBAC).
      # Host file must be owned by uid 1000, mode 0600.
      - "${AGENT_KUBECONFIG:-/etc/ai-agent/kubeconfig}:/app/kubeconfig:ro"
      # Persistent RAG memory DB (tool names only, no cluster data). Writable.
      - "agent_memory:/app/memory"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
