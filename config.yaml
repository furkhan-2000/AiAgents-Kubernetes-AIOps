# Agent configuration. Values can be overridden by environment variables.

ollama:
  url: "http://ollama:11434"
  model: "qwen2.5:7b-instruct-q5_K_M"   # Q5: higher accuracy (user preference); slower on CPU
  # CPU-only inference is slow, especially for the larger investigate prompts.
  # This is the per-call client timeout; keep it comfortably above warm latency.
  timeout_seconds: 300
  query_timeout_seconds: 90   # bounded timeout for the single /query LLM call

kubernetes:
  # Path to the least-privilege kubeconfig mounted read-only into the container.
  kubeconfig: "/app/kubeconfig"
  # Default namespace used when the user does not name one.
  default_namespace: "default"

# Investigate loop (/investigate): conversational, multi-step, read-only.
brain:
  # Strict anti-hallucination system prompt loaded for the loop.
  system_prompt_file: "/app/OLLAMA_BRAIN.md"

investigation:
  max_steps: 3               # hard cap on tool calls (CPU: fewer = smaller synth prompt = fewer timeouts)
  max_output_bytes: 1500     # per-tool output truncation (smaller prompt = faster CPU prefill + synth)
  loop_timeout_seconds: 600  # wall-clock budget for the whole loop (CPU 7B is slow)
  max_concurrent: 1          # ONE investigation at a time: 2x 7B on a CPU box saturates Ollama (seen: "Connection refused")
  synth_reserve_seconds: 240 # reserve more for the final summary call so broad questions still summarise on CPU
  cache_ttl_seconds: 30      # cache identical questions this long (0=off); short, as cluster state changes
  # Allowlist of tool NAMES the brain may call. All are read-only (see app/tools.py).
  # Keep in sync with app/tools.py CATALOG and the cluster read-only RBAC role.
  tools:
    - list_all_pods
    - list_pods
    - describe_pod
    - get_logs
    - get_events
    - list_nodes
    - describe_node
    - top_pods
    - top_nodes
    - list_deployments
    - describe_deployment
    - list_services
    - describe_service
    - get_endpoints
    - get_ingresses
    - get_pvcs
    - list_namespaces

# RAG memory (/investigate): remembers which READ-ONLY TOOLS answered similar past
# questions and suggests them, to make the weak model more consistent. Stores tool
# NAMES only (never data). Fail-open: any error = runs as if RAG is off.
rag:
  enabled: true            # turn on after pulling the embed model (see docs)
  embed_model: "nomic-embed-text"
  embed_dim: 768             # MUST match the embed model's output width
  embed_timeout_seconds: 20  # bounded so a slow embed can't stall /investigate
  db_path: "/app/memory/rag.db"
  top_k: 3
  min_similarity: 0.75       # only use matches above this cosine similarity
  max_rows: 5000             # bound the store size
  # Pre-seed: good question->tools examples loaded ONCE when the DB is empty, so RAG
  # helps from the first question. Tools must be read-only allowlist names.
  seed:
    - { q: "are all pods up and running", tools: [list_all_pods] }
    - { q: "how many pods are running", tools: [list_all_pods] }
    - { q: "pods in a namespace", tools: [list_pods] }
    - { q: "why is a pod restarting or crashing", tools: [list_all_pods, describe_pod, get_logs] }
    - { q: "what is wrong with a pod", tools: [describe_pod, get_logs, get_events] }
    - { q: "events in a namespace", tools: [get_events] }
    - { q: "node cpu and memory usage", tools: [top_nodes, list_nodes] }
    - { q: "why is a service unreachable", tools: [list_services, get_endpoints] }
    - { q: "storage and persistent volume claims", tools: [get_pvcs] }
    - { q: "is a deployment ready", tools: [list_deployments, describe_deployment] }
    - { q: "show the logs of a pod", tools: [get_logs] }
    - { q: "is the cluster healthy", tools: [list_all_pods, list_nodes] }

# The allowlist. Only these (verb, resource) pairs are permitted, all read-only.
# Anything not listed here is rejected.
allowlist:
  - { verb: "get",      resource: "pods" }
  - { verb: "get",      resource: "nodes" }
  - { verb: "get",      resource: "services" }
  - { verb: "get",      resource: "deployments" }
  - { verb: "get",      resource: "namespaces" }
  - { verb: "get",      resource: "persistentvolumeclaims" }
  - { verb: "get",      resource: "persistentvolumes" }
  - { verb: "get",      resource: "pvc" }
  - { verb: "get",      resource: "pv" }
  - { verb: "get",      resource: "ingresses" }
  - { verb: "get",      resource: "endpoints" }
  - { verb: "describe", resource: "pod" }
  - { verb: "describe", resource: "node" }
  - { verb: "describe", resource: "deployment" }
  - { verb: "get",      resource: "events" }
  - { verb: "logs",     resource: "pod" }
  - { verb: "top",      resource: "pods" }
  - { verb: "top",      resource: "nodes" }

# Optional namespace scope. Empty = any namespace allowed. Set to a list (e.g.
# ["app", "prod-app"]) to restrict BOTH endpoints to those namespaces only, a
# least-privilege control that also limits prompt-injection pivots. list_all_pods
# is exempt (it is cluster-wide by design).
allowed_namespaces: []
